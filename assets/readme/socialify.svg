    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163027" stroke-width="1" opacity=".48"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
