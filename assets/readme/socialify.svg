<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">SidePanel — your desktop status, at a glance</title>
  <desc id="desc">A terminal inspired status panel for hardware, smart home, weather, services and focus.</desc>
